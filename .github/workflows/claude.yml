name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'OWNER' ||
        github.event.review.author_association == 'MEMBER' ||
        github.event.review.author_association == 'OWNER' ||
        github.event.issue.author_association == 'MEMBER' ||
        github.event.issue.author_association == 'OWNER'
      ) && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Verify Trigger Logic & File Readability
        run: |
          echo "=== 1. KIỂM TRA LỖ HỔNG LOGIC ==="
          echo "Job đã chạy! Người bình luận: ${{ github.event.comment.user.login }}"
          
          echo ""
          echo "=== 2. KIỂM CHỨNG KHẢ NĂNG ĐỌC .git/config ==="
          if [ -f .git/config ]; then
            echo "✅ Tìm thấy tệp .git/config trong workspace!"
            echo "Để chứng minh tệp này đọc được, dưới đây là thông tin remote URL trích xuất từ file:"
            grep -A 2 '\[remote "origin"\]' .git/config || echo "Không tìm thấy cấu hình remote"
          else
            echo "❌ Không tìm thấy tệp .git/config"
          fi

